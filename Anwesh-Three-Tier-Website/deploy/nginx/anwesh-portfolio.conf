server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Copy frontend/index.html to /var/www/anwesh-portfolio/index.html.
    root /var/www/anwesh-portfolio;
    index index.html;

    # Up to five PDFs, each up to 5 MB, plus multipart form overhead.
    client_max_body_size 27m;

    location = /health-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # IMPORTANT: replace APP_TIER_PRIVATE_IP with your app EC2 private IP,
    # or the private DNS name of an internal load balancer for app EC2 instances.
    # Do not expose the app tier directly to the public internet.
    location /api/ {
        proxy_pass http://APP_TIER_PRIVATE_IP:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the original visitor protocol passed by the public ALB.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
